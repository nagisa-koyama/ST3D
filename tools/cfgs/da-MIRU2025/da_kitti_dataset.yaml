_BASE_CONFIG_: cfgs/da-MIRU2025/preprocess_default.yaml

DATASET: 'KittiDataset'
DATA_PATH: '../data/kitti'
ONTOLOGY: 'kitti'

# Required, not optional: kitti_dataset.py's __getitem__ reads this with DIRECT attribute access
# (`if self.dataset_cfg.FOV_POINTS_ONLY:`, no .get() fallback, present since the initial release),
# so an ABSENT key raises AttributeError at KITTI eval - not just a True value. False is also the
# only value that can be used, because the same line is followed by an assert(0) canary (1d20716)
# that hard-blocks FOV cropping for KITTI. See
# experiments_md/20260919_05_kitti_metrics_implementation_audit.md sections 11-12; same remedy as
# the kitti2nuscenes migration configs after job 20604 hit this.
FOV_POINTS_ONLY: False

DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [kitti_infos_train.pkl],
    'test': [kitti_infos_val.pkl],
}

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z'],
    src_feature_list: ['x', 'y', 'z', 'intensity'],
}

TEST:
    # Only FOV_FILTER is honoured here (kitti_dataset.py:288, applied to PREDICTED boxes).
    # USE_IMAGE_AREA_FILTER and LIMIT_RANGE ([-75.2, -75.2, -2, 75.2, 75.2, 4]) were removed
    # 2026-09-20: both had zero code references anywhere in the repo, so they silently implied
    # an image-area and range restriction that evaluation never applied. Ground truth is not
    # range-filtered at eval by any mechanism. See
    # experiments_md/20260920_01_evaluation_config_parameter_inventory.md sections 3 and 8.
    BOX_FILTER: {
        'FOV_FILTER': True
    }

