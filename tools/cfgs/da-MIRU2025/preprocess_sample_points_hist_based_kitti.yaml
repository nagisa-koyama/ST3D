POINT_CLOUD_RANGE: [-75.2, -75.2, -2, 75.2, 75.2, 4]
MIN_POINTS_OF_GT: 1
FOV_POINTS_ONLY: False
DRAW_CONF_CALIB_CURVE: False
RUN_CONF_CALIB: False

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['random_object_rotation', 'random_object_scaling', 'normalize_object_size']
    AUG_CONFIG_LIST:
        - NAME: random_object_scaling # Disabled
          SCALE_UNIFORM_NOISE: [0.9, 1.1]

        - NAME: normalize_object_size # Disabled
          SIZE_RES: [-0.91, -0.49, -0.26]

        - NAME: random_object_rotation # Disabled
          ROT_PROB: 1.0
          ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]

        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x', 'y']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]

HIST_DIST_KITTI_PATH: /storage/hist_dist_kitti_ckmtpyvu.npy
HIST_DIST_NUSCENES_PATH: /storage/hist_dist_nuscenes_ckmtpyvu.npy
HIST_DIST_LYFT_PATH: /storage/hist_dist_lyft_ckmtpyvu.npy
HIST_DIST_WAYMO_PATH: /storage/hist_dist_waymo_ckmtpyvu.npy
HIST_DIST_PANDASET_PATH: /storage/hist_dist_pandaset_ckmtpyvu.npy
POINT_CALIB_TAR: "kitti"

DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    - NAME: sample_points_hist_based

    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.1, 0.1, 0.15]
      MAX_POINTS_PER_VOXEL: 10
      MAX_NUMBER_OF_VOXELS: {
        'train': 100000,
        'test': 100000
      }

