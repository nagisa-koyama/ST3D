_BASE_CONFIG_: cfgs/da-MIRU2025/preprocess_sample_points_hist_based_to_kitti_wo_aug.yaml

DATASET: 'KittiDataset'
DATA_PATH: '../data/kitti'
ONTOLOGY: 'kitti'

# Required: kitti_dataset.py reads this with direct attribute access, so an ABSENT key
# raises AttributeError at KITTI eval. See da_kitti_dataset.yaml for the full rationale and
# experiments_md/20260919_05_kitti_metrics_implementation_audit.md sections 11-12.
FOV_POINTS_ONLY: False


DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [kitti_infos_train.pkl],
    'test': [kitti_infos_val.pkl],
}

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z'],
    src_feature_list: ['x', 'y', 'z', 'intensity'],
}

TEST:
    # Only FOV_FILTER is honoured here (kitti_dataset.py:288, applied to PREDICTED boxes).
    # USE_IMAGE_AREA_FILTER and LIMIT_RANGE ([-75.2, -75.2, -2, 75.2, 75.2, 4]) were removed
    # 2026-09-20: both had zero code references anywhere in the repo, so they silently implied
    # an image-area and range restriction that evaluation never applied. Ground truth is not
    # range-filtered at eval by any mechanism. See
    # experiments_md/20260920_01_evaluation_config_parameter_inventory.md sections 3 and 8.
    BOX_FILTER: {
        'FOV_FILTER': True
    }

SHIFT_COOR: [0.0, 0.0, 1.7]
