# ANALYSIS training row, item 72 (experiments_md 20261003_05 §5, design fixed 2026-11-29 00:15 JST): the Pandar64 x, y,
# z, intensity oracle O^i (cfgs/da-ieee-access/centerpoint-pandaset-spin2spin-xyzi.yaml: 26389's recipe, 115 epochs,
# plus intensity) with ONE factor of its TRAINING data set to the nuScenes value: intensity (the reader's /255), mapped
# onto nuScenes' per-range-ring distribution with nuscenes2pandaspin_rings.npz (Pandar64 onto nuScenes; built for item
# 72 from this oracle's training block and the nuScenes histogram stored in nuscenes2waymo_rings.npz, so all three
# targets share one nuScenes side exactly). Scored on spin val under rule A by the CPU successor.
# Contribution = AP(oracle) - AP(this row) at the same seed, Car BEV R40 IoU 0.7; detected if the two-seed mean is >= 2
# with one sign at both seeds. Target TRAIN labels train this row: labelled analysis, never a method.
# The arm: TRAIN_FACTOR_SWAP.INTENSITY_MAP (pcdet/datasets/intensity_swap.py), training only, on DATA_CONFIG only. Each
# training point's intensity x becomes F_nuS,r^-1(F_T,r(x)) in its horizontal-range ring r (0/10/20/30/40/50/75 m),
# the per-ring map of the evaluation-time stage map_intensity_to_reference. It is applied in the loader before
# augmentation, with a frame-seeded dequantization draw. x, y, z, boxes and labels are untouched. Evaluation reads
# DATA_CONFIG_TAR, the oracle's, unperturbed.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-pandaset-spin2spin-xyzi.yaml
DATA_CONFIG:
    TRAIN_FACTOR_SWAP:
        INTENSITY_MAP:
            TABLES: /storage/intensity_tables/nuscenes2pandaspin_rings.npz
