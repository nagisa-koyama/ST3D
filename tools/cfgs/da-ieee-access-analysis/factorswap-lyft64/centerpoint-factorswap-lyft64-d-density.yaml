# ANALYSIS training row, FACTOR-SWAP on lyft64 (experiments_md 20261003_05 §5 item 34): O_L64, the Lyft oracle
# recipe 25769 on the 64-beam platform (centerpoint-factorswap-lyft64-oracle.yaml, 30 epochs, 1 GPU x 6) with ONE
# factor of its TRAINING data set to the nuScenes value, training only (TRAIN_FACTOR_SWAP,
# pcdet/datasets/loader_factor_swap.py), scored on the target's UNPERTURBED val in-run (DATA_CONFIG_TAR is the
# oracle's). Contribution = AP(oracle) - AP(this row), Car BEV R40 IoU 0.7 (KITTI metric), one seed. Target TRAIN
# labels train this row: labelled analysis, never a method. Generated by analysis/make_factorswap_pl_configs.py from
# /home/koyama/data/factorswap_lyft/hist_lyft64_to_nuscenes.json (tools/analysis/factorswap_pl_stats.py, Slurm CPU
# job 31957, TRAIN split).
# This row: D, A1 density (not a TRAIN_FACTOR_SWAP arm): the Lyft-40 C1-analog 30313's operators on the 64-beam
# frames - per-range-bin GLOBAL thinning to nuScenes TRAIN (sample_points_hist_based, 50 bins to 75 m,
# MIN_HIST_BIN_FRACTION 0.01) and the processor-stage recount right after it (drop_empty_gt_boxes). The two
# histograms are the files below, measured ONCE by the stats job with the function train.py's on-the-fly path
# calls (point_calibration.compute_range_histogram, 1000 strided frames each): this source in training mode, and
# nuScenes TRAIN through the eval-mode view of 30313's target block (calibration_target_config). In-range points
# per frame 105046 -> 24719; expected kept share 0.232; 48 of 50 bins below 1. Fixed files instead of
# HIST_DIST_ON_THE_FLY because the on-the-fly path measures the target on DATA_CONFIG_TAR, which here is
# Lyft-64 val (the evaluation set), not nuScenes.
_BASE_CONFIG_: cfgs/da-ieee-access-analysis/factorswap-lyft64/centerpoint-factorswap-lyft64-oracle.yaml
DATA_CONFIG:
  POINT_CALIB_TAR: nuscenes
  HIST_DIST_LYFT_PATH: /home/koyama/data/factorswap_lyft/hist_dist_lyft64_train.npy
  HIST_DIST_NUSCENES_PATH: /home/koyama/data/factorswap_lyft/hist_dist_nuscenes_train.npy
  DATA_PROCESSOR:
  - {NAME: mask_points_and_boxes_outside_range, REMOVE_OUTSIDE_BOXES: true}
  - NAME: shuffle_points
    SHUFFLE_ENABLED: {train: true, test: false}
  - {NAME: sample_points_hist_based, MIN_HIST_BIN_FRACTION: 0.01}
  - {NAME: drop_empty_gt_boxes, MIN_POINTS: 1}
  - NAME: transform_points_to_voxels
    VOXEL_SIZE: [0.1, 0.1, 0.15]
    MAX_POINTS_PER_VOXEL: 10
    MAX_NUMBER_OF_VOXELS: {train: 150000, test: 150000}
