# ANALYSIS training row L'_K of item 43b (experiments_md 20261003_05 §5 item 43, design fixed 2026-11-09 01:18 JST;
# generated by analysis/make_item43_configs.py, do not edit). The S2 accumulation teacher 27468's config
# (cfgs/da-ieee-access/centerpoint-accum-legaldepth-nuscenes2kitti.yaml:
# Boston n008 15 / Singapore n015 10 sweeps, per-object motion compensation, MeanVFE, 20 epochs) with ONE arm on
# each platform block: random thinning per 1.5-m range bin to that platform's SINGLE-SWEEP in-grid point count
# (HIST_DIST_REFERENCE_CFG, HIST_DIST_IN_GRID, 1,000 calibration frames), then the label recount. It keeps the
# accumulated structure (ego-motion-shifted lattice, smear) at the single-sweep count. In-run evaluation on
# single-sweep nuScenes val (DATA_CONFIG_TAR = the oracle's). Contrasts: O_N - L'_K (structure at equal count),
# L'_K - R_acc (27468 / 27804; count part of the density term). nuScenes TRAIN labels train it: ANALYSIS.
DATA_CONFIGS:
  NUSCENES_N015:
    MAX_SWEEPS: 10
    GT_BOXES_MOTION_COMPENSATION: true
    INFO_PATH:
      train: [nuscenes_infos_200sweeps_train.pkl]
      test: [nuscenes_infos_200sweeps_val.pkl]
    VEHICLE: n015
    DATASET: NuScenesDataset
    DATA_PATH: ../data/nuscenes
    ONTOLOGY: nuscenes
    VERSION: v1.0-trainval
    PRED_VELOCITY: false
    SET_NAN_VELOCITY_TO_ZEROS: true
    FILTER_MIN_POINTS_IN_GT: 1
    BALANCED_RESAMPLING: false
    SHIFT_COOR: [0.0, 0.0, 1.75]
    DATA_SPLIT: {train: train, test: val}
    POINT_FEATURE_ENCODING:
      encoding_type: absolute_coordinates_encoding
      used_feature_list: [x, y, z]
      src_feature_list: [x, y, z, intensity, timestamp]
    POINT_CLOUD_RANGE: [-75.2, -75.2, -2, 75.2, 75.2, 4]
    MIN_POINTS_OF_GT: 1
    FOV_POINTS_ONLY: false
    DATA_AUGMENTOR:
      DISABLE_AUG_LIST: [normalize_object_size, random_object_rotation]
      AUG_CONFIG_LIST:
      - NAME: normalize_object_size
        SIZE_RES: [-0.91, -0.49, -0.26]
      - NAME: random_object_rotation
        ROT_PROB: 1.0
        ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
      - NAME: random_object_scaling
        SCALE_UNIFORM_NOISE:
          Car: [0.85, 1.2]
          Pedestrian: [0.8, 1.25]
      - NAME: random_world_flip
        ALONG_AXIS_LIST: [x, y]
      - NAME: random_world_rotation
        WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
      - NAME: random_world_scaling
        WORLD_SCALE_RANGE: [0.95, 1.05]
    DATA_PROCESSOR:
    - {NAME: mask_points_and_boxes_outside_range, REMOVE_OUTSIDE_BOXES: true}
    - NAME: shuffle_points
      SHUFFLE_ENABLED: {train: true, test: false}
    - {NAME: sample_points_hist_based, MIN_HIST_BIN_FRACTION: 0.01}
    - {NAME: drop_empty_gt_boxes, MIN_POINTS: 1}
    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.1, 0.1, 0.15]
      MAX_POINTS_PER_VOXEL: 10
      MAX_NUMBER_OF_VOXELS: {train: 150000, test: 150000}
    HIST_DIST_ON_THE_FLY: true
    HIST_DIST_FRAMES: 1000
    HIST_DIST_BINS: 50
    HIST_DIST_MAX_DIST: 75.0
    HIST_DIST_IN_GRID: true
    HIST_DIST_REFERENCE_CFG: cfgs/da-ieee-access-analysis/item43/centerpoint-i43-ref-single-n015.yaml
