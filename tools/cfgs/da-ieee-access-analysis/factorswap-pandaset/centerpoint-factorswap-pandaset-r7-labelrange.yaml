# 26389 (centerpoint-pandaset-spin2flash.yaml recipe, 115 epochs, 2 GPUs x 3) scored on Pandar64 spin val
# (centerpoint-pandaset-spin2spin.yaml) with ONE factor of its TRAINING data set to the nuScenes value, training
# only (TRAIN_FACTOR_SWAP, pcdet/datasets/loader_factor_swap.py), scored on the target's UNPERTURBED val in-run
# (DATA_CONFIG_TAR is the oracle's). Contribution = AP(oracle) - AP(this row), Car BEV R40 IoU 0.7 (KITTI metric),
# one seed. Target TRAIN labels train this row: labelled analysis, never a method. Generated by
# analysis/make_factorswap_pl_configs.py from /home/koyama/data/factorswap_pandaset/stats.json
# (tools/analysis/factorswap_pl_stats.py, Slurm CPU job 31954, TRAIN split).
