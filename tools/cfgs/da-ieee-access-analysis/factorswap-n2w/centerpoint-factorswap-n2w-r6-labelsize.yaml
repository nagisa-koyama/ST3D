# ANALYSIS training row, FACTOR-SWAP N->W (experiments_md 20261003_05 §5 item 24, the nuScenes -> Waymo port of the S2
# rows): the Waymo oracle recipe 26398 (65.92 / 51.77 Car BEV / 3D on Waymo val) with ONE factor of its TRAINING data set
# to the nuScenes value, training only, scored on UNPERTURBED Waymo val in-run (DATA_CONFIG_TAR is the oracle's).
# Contribution = AP(26398-recipe oracle) - AP(this row), Car BEV R40 (KITTI metric, all objects), one seed.
# Waymo TRAIN labels train this row: labelled analysis, never a method. Launch needs the user's approval.
# This arm: R6, A2 label size (convention): GT dims x (nuScenes / Waymo TRAIN median isotropic scale (l w h)^(1/3), on
# the boxes each loader trains on as that MODEL class), bottom kept, points untouched. Car 2.4669 / 2.5171 = 0.9800
# (medians l / w / h 4.59 / 1.94 / 1.70 vs 4.63 / 2.08 / 1.70); Pedestrian 0.9331 / 1.1053 = 0.8442 (0.71 / 0.66 / 1.78
# vs 0.92 / 0.85 / 1.76: the difference is in l and w only, so the isotropic factor also shortens Waymo pedestrians by
# ~16%); Cyclist unscaled (0.746, medians unreliable). NOTE Waymo 'Vehicle' (-> Car) includes trucks and buses, while
# nuScenes 'car' does not: the Car ratio mixes the box convention with the class definition.
# Values from /home/koyama/data/factorswap_n2w/stats.json (tools/analysis/factorswap_n2w_stats.py, Slurm CPU job 31454, TRAIN
# splits: Waymo 79,041 frames at SAMPLED_INTERVAL 2, nuScenes 28,130).
