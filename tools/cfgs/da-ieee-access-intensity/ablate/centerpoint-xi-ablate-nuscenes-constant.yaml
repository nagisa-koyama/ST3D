# DIAGNOSTIC, eval-only (2026-10-04, experiments_md/20261003_03 s7): does the nuscenes with-intensity oracle USE
# intensity? Its own eval set with intensity set to the dataset median 0.0453 (information and spread removed), everything else as centerpoint-sourceonly-nuscenes-xyzi.yaml.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-sourceonly-nuscenes-xyzi.yaml
DATA_CONFIG_TAR:
  DATA_PROCESSOR:
  - {NAME: mask_points_and_boxes_outside_range, REMOVE_OUTSIDE_BOXES: true}
  - NAME: shuffle_points
    SHUFFLE_ENABLED: {train: true, test: false}
  - {NAME: ablate_intensity, MODE: constant, INTENSITY_INDEX: 3, VALUE: 0.0453}
  - NAME: transform_points_to_voxels
    VOXEL_SIZE: [0.1, 0.1, 0.15]
    MAX_POINTS_PER_VOXEL: 10
    MAX_NUMBER_OF_VOXELS: {train: 150000, test: 150000}
