# IA-SSD, rule PB (experiments_md 20261024_05; T05 §5 "Rule PB, FIXED 15:53 JST", experiments_md 711912e /
# b68c164 / cbfbcf2): S2 A2 crop scoring twin (27688 protocol).
# Parent: iassd-accum-legaldepth-recount-nuscenes2kitti-fovtar.yaml. This file differs from it ONLY in each data block's budget (NUM_POINTS, both mode
# keys = the block's PB value) and, on the cost-fallback blocks below, the voxel step.
# PB value = the smallest multiple of 4,096 >= the 99th percentile of the in-range point count entering the
# budget step, on 1,000 strided frames of the block's TRAIN split (training blocks in training mode with
# augmentation; the eval block in evaluation mode on the target TRAIN split; val never sets a value).
# Legal: point counts of unlabelled TRAIN clouds only; no label, no AP read; one pre-declared rule, not tuned.
# Budgets: NUSCENES_N008 126976, NUSCENES_N015 106496, DATA_CONFIG_TAR 20480.
# COST FALLBACK (rule PB item 5; timing smoke job 30399: the PB step at the plain P99 budget timed 5.75x / 4.26x
# its 16,384 parent on NUSCENES_N008 / NUSCENES_N015): the authors' voxel step (shuffle_points, then sample_points_by_voxels,
# raw, 0.1 x 0.1 x 0.15 m, as iassd-sourceonly-waymo2waymo-vox65k) replaces the plain budget there, its cap lifted to
# 150000 (coordinator 17:05, experiments_md fcdc0f7); the budget is the P99 rule on its output (occupied voxels).
# An OPERATOR on those blocks, beside accumulation: it keeps one point per occupied voxel.
# Generated by tools/analysis/make_iassd_pb_configs.py from logs/iassd_pb_20261024/census (census job JSONs).
_BASE_CONFIG_: cfgs/da-ieee-access-pointrcnn/iassd-accum-legaldepth-recount-pb-nuscenes2kitti.yaml
DATA_CONFIGS:
  NUSCENES_N008:
    DATA_PROCESSOR:
    - {NAME: mask_points_and_boxes_outside_range, REMOVE_OUTSIDE_BOXES: true}
    - NAME: shuffle_points
      SHUFFLE_ENABLED: {train: true, test: false}
    - NAME: sample_points_by_voxels
      SAMPLE_TYPE: raw
      VOXEL_SIZE: [0.1, 0.1, 0.15]
      MAX_POINTS_PER_VOXEL: 5
      MAX_NUMBER_OF_VOXELS: {train: 150000, test: 150000}
      NUM_POINTS: {train: 126976, test: 126976}
    - {NAME: drop_empty_gt_boxes, MIN_POINTS: 1}
    - NAME: shuffle_points
      SHUFFLE_ENABLED: {train: true, test: false}
  NUSCENES_N015:
    DATA_PROCESSOR:
    - {NAME: mask_points_and_boxes_outside_range, REMOVE_OUTSIDE_BOXES: true}
    - NAME: shuffle_points
      SHUFFLE_ENABLED: {train: true, test: false}
    - NAME: sample_points_by_voxels
      SAMPLE_TYPE: raw
      VOXEL_SIZE: [0.1, 0.1, 0.15]
      MAX_POINTS_PER_VOXEL: 5
      MAX_NUMBER_OF_VOXELS: {train: 150000, test: 150000}
      NUM_POINTS: {train: 106496, test: 106496}
    - {NAME: drop_empty_gt_boxes, MIN_POINTS: 1}
    - NAME: shuffle_points
      SHUFFLE_ENABLED: {train: true, test: false}
DATA_CONFIG_TAR:
  FOV_POINTS_ONLY: true
  ALLOW_FOV_POINTS_ONLY: true
  DATA_PROCESSOR:
  - {NAME: mask_points_and_boxes_outside_range, REMOVE_OUTSIDE_BOXES: true}
  - NAME: sample_points
    NUM_POINTS: {train: 20480, test: 20480}
  - NAME: shuffle_points
    SHUFFLE_ENABLED: {train: true, test: false}
