# Parent: iassd-sourceonly-recount-nuscenes2kitti-fovtar.yaml. This file differs from it ONLY in each data block's budget (NUM_POINTS, both mode
# keys = the block's PB value).
# PB value = the smallest multiple of 4,096 >= the 99th percentile of the in-range point count entering the
# budget step, on 1,000 strided frames of the block's TRAIN split (training blocks in training mode with
# augmentation; the eval block in evaluation mode on the target TRAIN split; val never sets a value).
# Legal: point counts of unlabelled TRAIN clouds only; no label, no AP read; one pre-declared rule, not tuned.
# Budgets: DATA_CONFIG 28672, DATA_CONFIG_TAR 20480.
# Generated by tools/analysis/make_iassd_pb_configs.py from logs/iassd_pb_20261024/census (census job JSONs).
_BASE_CONFIG_: cfgs/da-ieee-access-pointrcnn/iassd-sourceonly-recount-pb-nuscenes2kitti.yaml
DATA_CONFIG:
  DATA_PROCESSOR:
  - {NAME: mask_points_and_boxes_outside_range, REMOVE_OUTSIDE_BOXES: true}
  - NAME: sample_points
    NUM_POINTS: {train: 28672, test: 28672}
  - {NAME: drop_empty_gt_boxes, MIN_POINTS: 1}
  - NAME: shuffle_points
    SHUFFLE_ENABLED: {train: true, test: false}
