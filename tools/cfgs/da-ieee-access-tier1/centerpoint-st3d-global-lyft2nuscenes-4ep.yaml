# TIER-1 PROXY of da-ieee-access/centerpoint-st3d-global-lyft2nuscenes.yaml (self-training row). See README.md.
# Schedule only: NUM_EPOCHS 30 -> 4, and PROG_AUG's epoch-indexed ramp [8, 15, 23] rescaled to the
# same fractions of the run, [1, 2, 3]. Left at [8, 15, 23] the ramp would never fire in 4 epochs,
# which would silently remove part of the recipe.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-st3d-global-lyft2nuscenes.yaml

OPTIMIZATION:
    NUM_EPOCHS: 4

SELF_TRAIN:
    PROG_AUG:
        UPDATE_AUG: [1, 2, 3]
