CLASS_NAMES: ['waymo:Vehicle', 'waymo:Pedestrian', 'lyft:car', 'lyft:pedestrian', 'pandaset:Car', 'pandaset:Pedestrian', 'nuscenes:car', 'nuscenes:pedestrian', 'kitti:Car', 'kitti:Pedestrian']
ONTOLOGY: null

# Defined for build_model but not used for self training.
DATA_CONFIGS:
    LYFT_CONFIG:
        _BASE_CONFIG_: cfgs/dataset_configs/da_lyft_dataset.yaml
        CLASS_NAMES: ['lyft:car', 'lyft:pedestrian']
        DRAW_CONF_CALIB_CURVE: False
        RUN_CONF_CALIB: False
        SHIFT_COOR: [0.0, 0.0, 1.6]
        MAX_SWEEPS: 1
        DATA_AUGMENTOR:
          DISABLE_AUG_LIST: ['random_object_rotation', 'normalize_object_size', 'random_world_sampling']
          # DISABLE_AUG_LIST: ['normalize_object_size', 'random_object_rotation', 'random_world_flip', 'random_world_rotation', 'random_world_scaling']
          # DISABLE_AUG_LIST: ['random_object_scaling', 'normalize_object_size', 'random_object_rotation', 'random_world_sampling', 'random_world_flip', 'random_world_rotation', 'random_world_scaling']
          AUG_CONFIG_LIST:
              - NAME: random_object_scaling
                SCALE_UNIFORM_NOISE: [0.8260869565217391, 0.8260869565217391]

              - NAME: normalize_object_size # Disabled
                SIZE_RES: [-0.91, -0.49, -0.26]

              - NAME: random_object_rotation # Disabled
                ROT_PROB: 1.0
                ROT_UNIFORM_NOISE: [-0.728539816, 0.78539816]

              - NAME: random_world_sampling # Disabled
                PROB: 1.0
                WORLD_SAMPLE_RATIO: [0.9465160743068608, 0.9465160743068608]

              - NAME: random_world_flip
                ALONG_AXIS_LIST: ['x', 'y']

              - NAME: random_world_rotation
                WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

              - NAME: random_world_scaling
                WORLD_SCALE_RANGE: [0.95, 1.05]
    KITTI_CONFIG:
        _BASE_CONFIG_: cfgs/dataset_configs/da_kitti_dataset.yaml
        FOV_POINTS_ONLY: False
        CLASS_NAMES: ['kitti:Car', 'kitti:Pedestrian']
        SHIFT_COOR: [0.0, 0.0, 1.7]
        DRAW_CONF_CALIB_CURVE: False
        RUN_CONF_CALIB: False
        DATA_PROCESSOR:
            - NAME: mask_points_and_boxes_outside_range
              REMOVE_OUTSIDE_BOXES: True

            - NAME: shuffle_points
              SHUFFLE_ENABLED: {
                  'train': True,
                  'test': False
              }

            - NAME: sample_points
              NUM_POINTS: {
                  'train': 62650,
                  'test': 62650
              }

            - NAME: transform_points_to_voxels
              VOXEL_SIZE: [0.1, 0.1, 0.15]
              MAX_POINTS_PER_VOXEL: 50
              MAX_NUMBER_OF_VOXELS: {
                  'train': 80000,
                  'test': 90000
              }
        DATA_AUGMENTOR:
          DISABLE_AUG_LIST: ['random_object_rotation', 'normalize_object_size',  'random_world_sampling']
          # DISABLE_AUG_LIST: ['normalize_object_size', 'random_object_rotation', 'random_world_flip', 'random_world_rotation', 'random_world_scaling']
          # DISABLE_AUG_LIST: ['random_object_scaling', 'normalize_object_size', 'random_object_rotation', 'random_world_sampling', 'random_world_flip', 'random_world_rotation', 'random_world_scaling']
          AUG_CONFIG_LIST:
              - NAME: random_object_scaling
                SCALE_UNIFORM_NOISE: [1.0, 1.0]

              - NAME: normalize_object_size # Disabled
                SIZE_RES: [-0.91, -0.49, -0.26]

              - NAME: random_object_rotation # Disabled
                ROT_PROB: 1.0
                ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]

              - NAME: random_world_sampling # Disabled
                PROB: 1.0
                WORLD_SAMPLE_RATIO: [1.0, 1.0]

              - NAME: random_world_flip
                ALONG_AXIS_LIST: ['x', 'y']

              - NAME: random_world_rotation
                WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

              - NAME: random_world_scaling
                WORLD_SCALE_RANGE: [0.95, 1.05]
