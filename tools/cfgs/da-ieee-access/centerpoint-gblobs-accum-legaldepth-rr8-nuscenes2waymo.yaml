# RELOCATE-AND-RENDER v8: 29690's configuration plus 1:1 background copies, aimed at the shortcut (experiments_md 20261018_02
# §13; T05 §5 ae0cb00, amended feea0be; user ~11:50 10-21 「v8 を 1 回」). Every key of ...-rr7a-... (v7 arm (a), v6's fit frozen,
# E5a ground) plus BG_DB_* : after the car copies, one background copy per placed car copy from a database of unannotated
# source clutter (rr_build_bgdb.py), placed by the car rules, rendered through the same lattice, occlusion and return model
# (reference band), adding NO box and NO label. Car path = 29690's (its known fit-check failure, windows band 60-75 m, is
# disclosed).
#
# Base: teacher 27471's source recipe unchanged (ST3D df345c0, W&B jguwly5u) + the FULL Waymo target block 27596 scored
# 27471 with; read against 27596 = 51.58 Car BEV AP_R40 at IoU 0.7 on Waymo val, epoch 20, and 29690 = 49.06. Legality:
# background regions use SOURCE labels only (to exclude objects); E5a reads SOURCE GT boxes; the return model as v6.
