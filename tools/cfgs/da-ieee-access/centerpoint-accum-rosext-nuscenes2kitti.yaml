# nuScenes -> KITTI, accumulation only, Car ROS interval [0.81, 1.06] centred on the TARGET-FREE size
# ratio estimated from point extents (experiments_md/20260930_05).
#
# Differs from centerpoint-accum-nuscenes2kitti (26388: [0.85, 1.20]) and centerpoint-accum-rosshrink-
# nuscenes2kitti (26536: [0.75, 1.00], prior knowledge) only in the Car interval.
#
# WHERE 0.933 COMES FROM (no target label read): the accumulation model's own confident Car boxes on
# KITTI TRAIN (pseudo-labels 7k0jxlv7, score >= 0.5, <= 30 m) hold points whose extent along the box
# axes is 3.815 / 1.710 / 1.432 m; the same statistic on nuScenes train GT boxes (15 sweeps) is
# 4.089 / 1.786 / 1.369. The ratio of extents is 0.933 (length); the interval is that centre with the
# shrinking row's width 0.25. A source-calibrated (extent -> GT size) estimate is NOT used: nuScenes
# GT boxes are ~12% longer than their point clouds even when dense, KITTI's ~1%, so the source
# calibration transfers an annotation convention, not a size (validation against KITTI GT: true ratio
# 0.84; pooled calibration gives 0.93-1.05, density-matched 0.96-1.12). This row therefore measures how
# much of 26536's +7 BEV / +11 3D a target-free geometric estimate recovers; the remainder is the
# label-convention part that only target statistics (SN) or prior knowledge can supply.
#
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-accum-nuscenes2kitti.yaml

DATA_CONFIGS:
    NUSCENES_N008:
        DATA_AUGMENTOR:
            DISABLE_AUG_LIST: ['normalize_object_size', 'random_object_rotation']
            AUG_CONFIG_LIST:
                - NAME: normalize_object_size  # DISABLED - not UDA-legal
                  SIZE_RES: [-0.91, -0.49, -0.26]
                - NAME: random_object_rotation  # DISABLED
                  ROT_PROB: 1.0
                  ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
                - NAME: random_object_scaling
                  SCALE_UNIFORM_NOISE: {
                      'Car': [0.81, 1.06],
                      'Pedestrian': [0.80, 1.25]
                  }
                - NAME: random_world_flip
                  ALONG_AXIS_LIST: ['x', 'y']
                - NAME: random_world_rotation
                  WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
                - NAME: random_world_scaling
                  WORLD_SCALE_RANGE: [0.95, 1.05]
    NUSCENES_N015:
        DATA_AUGMENTOR:
            DISABLE_AUG_LIST: ['normalize_object_size', 'random_object_rotation']
            AUG_CONFIG_LIST:
                - NAME: normalize_object_size  # DISABLED - not UDA-legal
                  SIZE_RES: [-0.91, -0.49, -0.26]
                - NAME: random_object_rotation  # DISABLED
                  ROT_PROB: 1.0
                  ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
                - NAME: random_object_scaling
                  SCALE_UNIFORM_NOISE: {
                      'Car': [0.81, 1.06],
                      'Pedestrian': [0.80, 1.25]
                  }
                - NAME: random_world_flip
                  ALONG_AXIS_LIST: ['x', 'y']
                - NAME: random_world_rotation
                  WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
                - NAME: random_world_scaling
                  WORLD_SCALE_RANGE: [0.95, 1.05]
