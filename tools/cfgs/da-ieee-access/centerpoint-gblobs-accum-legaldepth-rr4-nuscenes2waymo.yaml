# RELOCATE-AND-RENDER v4 (RR v4), the METHOD row for nuScenes -> Waymo (experiments_md 20261018_02 §8; design fixed in
# T05 §5, experiments_md aa3962e; user ~12:03 10-18 「近傍の点の高さを採用しては」). v4 = v3
# (centerpoint-gblobs-accum-legaldepth-rr3-nuscenes2waymo, gate v3 failed on D1 v3 and the target dump, never launched)
# with two changes: the copy's bottom is the 10th percentile of z of the frame's points (before RR, no copy's points)
# whose BEV distance to the copy's footprint lies in (0.5, 3] m, if there are >= 10 of them, else the frame's RANSAC
# plane (counted); and the copy's box must lie inside the z range of POINT_CLOUD_RANGE (else the attempt is re-drawn).
# The GROUND_* keys are kept as the parameters of the gate's D1 v4 reference; the v4 loader does not read them.
#
# Base: teacher 27471's source recipe unchanged (ST3D df345c0, W&B jguwly5u) + the FULL Waymo target block 27596 scored
# 27471 with; read against 27596 = 51.58 Car BEV AP_R40 at IoU 0.7 on Waymo val, epoch 20. See the v2 config's header
# for the v2 elements and legality; v4 adds only label-free heights from the frame's own source points.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-accum-legaldepth-nuscenes2waymo.yaml

MODEL:
    VFE:
        NAME: GBlobsVFE
        RELATIVE_DISTANCE: True
        COVARIANCE_ONLY: False
        COVARIANCE_SCALE: 1.0

DATA_CONFIGS:
    NUSCENES_N008:
        DATA_AUGMENTOR:
            AUG_CONFIG_LIST:
                - NAME: relocate_render
                  VERSION: 4
                  NEAR_D_LO: 0.5
                  NEAR_D_HI: 3.0
                  NEAR_MIN_POINTS: 10
                  NEAR_PCT: 10.0
                  GROUND_CELL: 1.0
                  GROUND_CELL_MIN_PTS: 3
                  GROUND_RADIUS: 5.0
                  GROUND_MIN_CELLS: 3
                  GROUND_PCT: 20.0
                  DONOR_CLASS: Car
                  N_COPIES: 8
                  MAX_TRIES: 20
                  R_MIN: 5.0
                  R_MAX: 75.2
                  BEV_MARGIN: 0.5
                  MAX_SCENE_POINTS: 5
                  CLEARANCE: 0.3
                  VIS_MAX_SHARE: 0.1
                  VIS_HEIGHT: 0.3
                  RC_MIN: 0.8
                  RC_OCCL_M: 0.5
                  OCCLUSION_M: 0.5
                  POINT_CLOUD_RANGE: [-75.2, -75.2, -2, 75.2, 75.2, 4]
                  TIME_COLUMN: 4
                  LATTICE: waymo_top_train
                  N_COLS: 2650
                  MOUNT_HEIGHT: 2.184
                  CALIB: /home/koyama/data/waymo_top_calib/top_calib.pkl
                  TRAIN_SEGMENTS: /home/koyama/data/waymo_open_dataset_v_1_4_0/pcdet_structure/ImageSets/train.txt
                  DB_POINTS: /home/koyama/data/relocate_render_20261018/v2/db_NUSCENES_N008_points.npy
                  DB_INDEX: /home/koyama/data/relocate_render_20261018/v2/db_NUSCENES_N008_index.npz
                - NAME: normalize_object_size
                  SIZE_RES: [-0.91, -0.49, -0.26]
                - NAME: random_object_rotation
                  ROT_PROB: 1.0
                  ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
                - NAME: random_object_scaling
                  SCALE_UNIFORM_NOISE: {'Car': [0.85, 1.2], 'Pedestrian': [0.8, 1.25]}
                - NAME: random_world_flip
                  ALONG_AXIS_LIST: ['x', 'y']
                - NAME: random_world_rotation
                  WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
                - NAME: random_world_scaling
                  WORLD_SCALE_RANGE: [0.95, 1.05]
