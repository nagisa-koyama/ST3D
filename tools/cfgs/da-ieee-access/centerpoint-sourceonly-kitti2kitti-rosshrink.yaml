# KITTI in-domain ORACLE with the SHRINKING Car interval [0.75, 1.00] - the like-for-like ceiling for
# job 26536 (accumulated nuScenes -> KITTI at the same interval: 78.88 moderate BEV, above the
# 75.17 oracle that trained at [0.85, 1.20]). One key from centerpoint-sourceonly-kitti2kitti: the
# Car scaling interval. The list is restated in full because YAML lists replace rather than merge.
# Its sibling -noros disables object scaling altogether (the augmentation-free ceiling).
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-sourceonly-kitti2kitti.yaml

DATA_CONFIG:
    DATA_AUGMENTOR:
        DISABLE_AUG_LIST: ['normalize_object_size', 'random_object_rotation']
        AUG_CONFIG_LIST:
            - NAME: normalize_object_size  # DISABLED - not UDA-legal, kept for list parity
              SIZE_RES: [-0.91, -0.49, -0.26]
            - NAME: random_object_rotation  # DISABLED
              ROT_PROB: 1.0
              ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
            - NAME: random_object_scaling
              SCALE_UNIFORM_NOISE: {
                  'Car': [0.75, 1.00],
                  'Pedestrian': [0.80, 1.25]
              }
            - NAME: random_world_flip
              ALONG_AXIS_LIST: ['x', 'y']
            - NAME: random_world_rotation
              WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
            - NAME: random_world_scaling
              WORLD_SCALE_RANGE: [0.95, 1.05]
