# Three-level DA grid on S2 (experiments_md/20261004_01), cell O: OUTPUT-level correction alone.
# Single-sweep nuScenes source-only (the 26265 control's recipe) with the Car ROS interval centred on
# the target-free size ratio 0.933, [0.81, 1.06], exactly as 26814 does on top of accumulation.
# One variable from centerpoint-sourceonly-nuscenes2kitti (25743 / 26265: 41.57 / 22.58).
# Caveat to state: the ratio was measured with the accumulation teacher's confident KITTI boxes
# (20260930_05); point extents depend on the KITTI points, not on that teacher's box sizes.
# ENTRY train.py, 1 GPU (~14 h measured for the 20-epoch nuScenes source-only row on one GPU).
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-sourceonly-nuscenes2kitti.yaml

DATA_CONFIG:
    DATA_AUGMENTOR:
        DISABLE_AUG_LIST: ['normalize_object_size', 'random_object_rotation']
        AUG_CONFIG_LIST:
            - NAME: normalize_object_size  # DISABLED - not UDA-legal
              SIZE_RES: [-0.91, -0.49, -0.26]
            - NAME: random_object_rotation  # DISABLED
              ROT_PROB: 1.0
              ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
            - NAME: random_object_scaling
              SCALE_UNIFORM_NOISE: {
                  'Car': [0.81, 1.06],
                  'Pedestrian': [0.80, 1.25]
              }
            - NAME: random_world_flip
              ALONG_AXIS_LIST: ['x', 'y']
            - NAME: random_world_rotation
              WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
            - NAME: random_world_scaling
              WORLD_SCALE_RANGE: [0.95, 1.05]
