# Foreground v2 with the WEAKEST teacher: the MeanVFE source-only baseline (job 25835, W&B ldb35c2o,
# 23.17 BEV on nuScenes val) as teacher AND student init, instead of the global-correction model
# iwg6l5v1 (28.22). Same architecture, so only the checkpoint changes at launch; the config differs
# from centerpoint-foreground-v2-lyft2nuscenes ONLY in SCORE_THRESH, which is teacher-specific (count
# balance per class, 20260927_04 section 2b) and is re-derived from this teacher's own pseudo-labels:
#   scripts/generate_pseudo_labels.sh cfgs/da-ieee-access/centerpoint-foreground-v2-lyft2nuscenes.yaml \
#       <ldb35c2o ep30> /storage/pseudo_labels/ldb35c2o_ep30_nuscenes_train_thr0.0001
#   then analysis/pseudo_label_threshold/{persistence.py, joint_mixture.py}.
# Sibling: ...-teacher-gblobs (the strongest teacher). Three-point teacher-strength series with v2.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-foreground-v2-lyft2nuscenes.yaml

SELF_TRAIN:
    SCORE_THRESH: [0.21, 0.19, 0.18]   # PLACEHOLDER = v2's values for iwg6l5v1; re-derived below
