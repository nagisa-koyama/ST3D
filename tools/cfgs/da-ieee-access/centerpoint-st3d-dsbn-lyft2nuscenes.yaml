# Pseudo-labelling with PER-DOMAIN BatchNorm (student side), Lyft -> nuScenes (experiments_md/20261004_01).
#
# Textbook pseudo-labelling (centerpoint-st3d-lyft2nuscenes with teacher + init = the source-only
# model ldb35c2o ep30: job 26698, 23.55) with SELF_TRAIN.DSNORM: every BatchNorm becomes a DSNorm with
# a SOURCE and a TARGET set of statistics; source batches use and update the source set, target
# (pseudo-labelled) batches the target set, and evaluation uses the target set. The teacher is
# converted too, but loaded from a source-only checkpoint its target set is a copy of the source set,
# so it still labels with source statistics - centerpoint-st3d-dsbn-adabnteacher-lyft2nuscenes fixes
# that. Why: test-time BN re-estimation alone lifts this teacher 23.17 -> 28.93 (seed 2: 25.05 ->
# 28.22), the size of the density correction's gain (AdaBN job 27287).
# Launch as 26698: 2 GPUs, --pretrained_model and --pretrained_model_teacher = ldb35c2o ep30.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-st3d-lyft2nuscenes.yaml

SELF_TRAIN:
    DSNORM: True
