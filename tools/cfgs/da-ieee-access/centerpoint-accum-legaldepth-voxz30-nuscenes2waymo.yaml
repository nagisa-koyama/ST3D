# EVAL-ONLY Waymo twin of centerpoint-accum-legaldepth-voxz30-nuscenes2kitti (voxel z 0.30 m, 128 BEV channels). Source and
# MODEL blocks identical to the training config; target block = 27590's with the same voxel size. Reading in the training config.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-accum-legaldepth-nuscenes2waymo.yaml

DATA_CONFIGS:
    NUSCENES_N008:
        DATA_PROCESSOR:
            - NAME: mask_points_and_boxes_outside_range
              REMOVE_OUTSIDE_BOXES: True
            - NAME: shuffle_points
              SHUFFLE_ENABLED: {'train': True, 'test': False}
            - NAME: transform_points_to_voxels
              VOXEL_SIZE: [0.1, 0.1, 0.30]
              MAX_POINTS_PER_VOXEL: 10
              MAX_NUMBER_OF_VOXELS: {'train': 150000, 'test': 150000}
    NUSCENES_N015:
        DATA_PROCESSOR:
            - NAME: mask_points_and_boxes_outside_range
              REMOVE_OUTSIDE_BOXES: True
            - NAME: shuffle_points
              SHUFFLE_ENABLED: {'train': True, 'test': False}
            - NAME: transform_points_to_voxels
              VOXEL_SIZE: [0.1, 0.1, 0.30]
              MAX_POINTS_PER_VOXEL: 10
              MAX_NUMBER_OF_VOXELS: {'train': 150000, 'test': 150000}
DATA_CONFIG_TAR:
        DATA_PROCESSOR:
            - NAME: mask_points_and_boxes_outside_range
              REMOVE_OUTSIDE_BOXES: True
            - NAME: shuffle_points
              SHUFFLE_ENABLED: {'train': True, 'test': False}
            - NAME: transform_points_to_voxels
              VOXEL_SIZE: [0.1, 0.1, 0.30]
              MAX_POINTS_PER_VOXEL: 10
              MAX_NUMBER_OF_VOXELS: {'train': 150000, 'test': 150000}

MODEL:
    BACKBONE_3D:
        NAME: VoxelResBackBone8x
        last_pad: 1
    MAP_TO_BEV:
        NAME: HeightCompression
        NUM_BEV_FEATURES: 128
