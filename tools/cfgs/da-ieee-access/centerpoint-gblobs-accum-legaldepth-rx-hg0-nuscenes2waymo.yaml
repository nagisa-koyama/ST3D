# ROW EXTRUSION (RX), arm H-G0: the METHOD row candidate for nuScenes -> Waymo (experiments_md 20261021_02; design, arms and
# CPU gate X1-X4 fixed in T05 §5, experiments_md 9a7c1f5 / b479ec7, before any RX number; user ~22:40 10-21 「はい」; rows for
# every passing arm, user ~23:10 10-21, d2797c9).
#
# 27471's source pipeline in RR's lineage (centerpoint-gblobs-accum-legaldepth-rr7a-nuscenes2waymo, 29690's config) with the
# relocate_render entry REMOVED and DATA_CONFIGS.<platform>.ROW_EXTRUSION added: every source point is kept, and each far
# car's few HDL-32E lines are stacked in height at the virtual Waymo TOP's rows, bounded by the source boxes (inside a box:
# up to the box's surface; outside: +-0.665 deg of the line, above S, never into a box), with the drop of a teacher-detected
# Waymo TRAIN car of the same range and aspect transplanted onto Car boxes and the label-free q elsewhere
# (pcdet/datasets/augmentor/row_extrusion.py; hook at RR's slot in dataset.prepare_data, training only). G0: no ground fill.
#
# Base: teacher 27471's source recipe unchanged (ST3D df345c0, W&B jguwly5u) + the FULL Waymo target block 27596 scored 27471
# with; read against 27596 = 51.58 Car BEV AP_R40 at IoU 0.7 on Waymo val, epoch 20 (R1 of T05 §5 RX).
# Legality: the lattice is the target's published calibration (TRAIN segments); the library and q are label-free
# (teacher 27471's detections on Waymo TRAIN, fit-set segments; no Waymo label); boxes and E5a are SOURCE labels.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-accum-legaldepth-nuscenes2waymo.yaml

MODEL:
    VFE:
        NAME: GBlobsVFE
        RELATIVE_DISTANCE: True
        COVARIANCE_ONLY: False
        COVARIANCE_SCALE: 1.0

DATA_CONFIGS:
    NUSCENES_N008:
        ROW_EXTRUSION:
            ARM: H
            GROUND: G0
            LIBRARY: /home/koyama/data/row_extrusion_20261021/library.npz
        DATA_AUGMENTOR:
            AUG_CONFIG_LIST:
                - NAME: normalize_object_size
                  SIZE_RES: [-0.91, -0.49, -0.26]
                - NAME: random_object_rotation
                  ROT_PROB: 1.0
                  ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
                - NAME: random_object_scaling
                  SCALE_UNIFORM_NOISE: {'Car': [0.85, 1.2], 'Pedestrian': [0.8, 1.25]}
                - NAME: random_world_flip
                  ALONG_AXIS_LIST: ['x', 'y']
                - NAME: random_world_rotation
                  WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
                - NAME: random_world_scaling
                  WORLD_SCALE_RANGE: [0.95, 1.05]
    NUSCENES_N015:
        ROW_EXTRUSION:
            ARM: H
            GROUND: G0
            LIBRARY: /home/koyama/data/row_extrusion_20261021/library.npz
        DATA_AUGMENTOR:
            AUG_CONFIG_LIST:
                - NAME: normalize_object_size
                  SIZE_RES: [-0.91, -0.49, -0.26]
                - NAME: random_object_rotation
                  ROT_PROB: 1.0
                  ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
                - NAME: random_object_scaling
                  SCALE_UNIFORM_NOISE: {'Car': [0.85, 1.2], 'Pedestrian': [0.8, 1.25]}
                - NAME: random_world_flip
                  ALONG_AXIS_LIST: ['x', 'y']
                - NAME: random_world_rotation
                  WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
                - NAME: random_world_scaling
                  WORLD_SCALE_RANGE: [0.95, 1.05]
