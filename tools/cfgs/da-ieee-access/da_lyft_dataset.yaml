# Lyft Level 5 as a labelled SOURCE.
_BASE_CONFIG_: cfgs/da-ieee-access/preprocess_sourceonly.yaml

DATASET: 'LyftDataset'
DATA_PATH: '../data/lyft'
ONTOLOGY: 'lyft'

VERSION: 'trainval'
MAX_SWEEPS: 1
SET_NAN_VELOCITY_TO_ZEROS: True
FILTER_MIN_POINTS_IN_GT: 1
EVAL_LYFT_IOU_LIST: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

# CHANGED from the repo's long-standing 1.60, which is too low. Lyft is the one platform where
# BOTH estimators exceed the configured value (road -1.85/-1.87, median Car box base -1.87/-2.04),
# so this is not estimator bias: at 1.60 the cars sit roughly 0.3-0.4 m below the anchor plane
# that anchor_bottom_heights: [0] assumes. See experiments_md/20260922_03 section 1.
#
# 1.87 is the 40-BEAM value. Lyft ships two vehicle configurations and they want different shifts
# (40-beam 1.87, 64-beam 2.04), so no single constant is right for both; 1.87 is chosen because
# the 40-beam hosts are 15,498 of 18,900 train frames (82%). Expressing both would need
# LIDAR_CONFIG (ST3D adda12b), which is deliberately absent here - one config per dataset.
SHIFT_COOR: [0.0, 0.0, 1.87]

DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [lyft_infos_train.pkl],
    'test': [lyft_infos_val.pkl],
}

# Intensity is excluded here as cross-sensor DA protocol, as everywhere in the da_* family. For
# Lyft specifically it would carry nothing anyway: every return in the dataset has intensity
# exactly 100 (a documented upstream defect, lyft/nuscenes-devkit#3).
POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z'],
    src_feature_list: ['x', 'y', 'z', 'intensity', 'timestamp'],
}
