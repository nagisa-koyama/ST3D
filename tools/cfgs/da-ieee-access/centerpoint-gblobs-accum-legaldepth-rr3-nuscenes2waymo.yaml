# RELOCATE-AND-RENDER v3 (RR v3), the METHOD row for nuScenes -> Waymo (experiments_md 20261018_02 §7; design fixed in
# T05 §5, experiments_md 9334105; user ~11:14 10-18 「地面を直して再判定 (推奨)」). v3 = v2
# (centerpoint-gblobs-accum-legaldepth-rr2-nuscenes2waymo, gate v2 failed on G4 and D1, never launched) with ONE change:
# the copy's bottom height is the 20th percentile of the second-lowest z of the frame's 1 m BEV cells (>= 3 points)
# whose centre lies within 5 m of the copy's centre, if there are >= 3 such cells; otherwise the frame's RANSAC plane
# (counted). Everything else is v2's, including the visibility rule's 0.3 m above the PLANE and v2's donor database.
#
# Base: teacher 27471's source recipe unchanged (ST3D df345c0, W&B jguwly5u) + the FULL Waymo target block 27596 scored
# 27471 with; read against 27596 = 51.58 Car BEV AP_R40 at IoU 0.7 on Waymo val, epoch 20. See the v2 config's header
# for the v2 elements and legality; v3 adds only the label-free local ground height from the frame's own source points.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-accum-legaldepth-nuscenes2waymo.yaml

MODEL:
    VFE:
        NAME: GBlobsVFE
        RELATIVE_DISTANCE: True
        COVARIANCE_ONLY: False
        COVARIANCE_SCALE: 1.0

DATA_CONFIGS:
    NUSCENES_N008:
        DATA_AUGMENTOR:
            AUG_CONFIG_LIST:
                - NAME: relocate_render
                  VERSION: 3
                  GROUND_CELL: 1.0
                  GROUND_CELL_MIN_PTS: 3
                  GROUND_RADIUS: 5.0
                  GROUND_MIN_CELLS: 3
                  GROUND_PCT: 20.0
                  DONOR_CLASS: Car
                  N_COPIES: 8
                  MAX_TRIES: 20
                  R_MIN: 5.0
                  R_MAX: 75.2
                  BEV_MARGIN: 0.5
                  MAX_SCENE_POINTS: 5
                  CLEARANCE: 0.3
                  VIS_MAX_SHARE: 0.1
                  VIS_HEIGHT: 0.3
                  RC_MIN: 0.8
                  RC_OCCL_M: 0.5
                  OCCLUSION_M: 0.5
                  POINT_CLOUD_RANGE: [-75.2, -75.2, -2, 75.2, 75.2, 4]
                  TIME_COLUMN: 4
                  LATTICE: waymo_top_train
                  N_COLS: 2650
                  MOUNT_HEIGHT: 2.184
                  CALIB: /home/koyama/data/waymo_top_calib/top_calib.pkl
                  TRAIN_SEGMENTS: /home/koyama/data/waymo_open_dataset_v_1_4_0/pcdet_structure/ImageSets/train.txt
                  DB_POINTS: /home/koyama/data/relocate_render_20261018/v2/db_NUSCENES_N008_points.npy
                  DB_INDEX: /home/koyama/data/relocate_render_20261018/v2/db_NUSCENES_N008_index.npz
                - NAME: normalize_object_size
                  SIZE_RES: [-0.91, -0.49, -0.26]
                - NAME: random_object_rotation
                  ROT_PROB: 1.0
                  ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
                - NAME: random_object_scaling
                  SCALE_UNIFORM_NOISE: {'Car': [0.85, 1.2], 'Pedestrian': [0.8, 1.25]}
                - NAME: random_world_flip
                  ALONG_AXIS_LIST: ['x', 'y']
                - NAME: random_world_rotation
                  WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
                - NAME: random_world_scaling
                  WORLD_SCALE_RANGE: [0.95, 1.05]
    NUSCENES_N015:
        DATA_AUGMENTOR:
            AUG_CONFIG_LIST:
                - NAME: relocate_render
                  VERSION: 3
                  GROUND_CELL: 1.0
