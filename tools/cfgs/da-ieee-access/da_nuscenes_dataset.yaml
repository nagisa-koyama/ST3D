# nuScenes. Used BOTH as a labelled source (centerpoint-sourceonly-nuscenes.yaml) and as the
# common unlabelled evaluation target of all five configs in this family.
_BASE_CONFIG_: cfgs/da-ieee-access/preprocess_sourceonly.yaml

DATASET: 'NuScenesDataset'
DATA_PATH: '../data/nuscenes'
ONTOLOGY: 'nuscenes'

VERSION: 'v1.0-trainval'
# 1 keyframe, no sweeps - see preprocess_sourceonly.yaml for why this family accumulates nothing.
# Note this does NOT contradict the infos filename below: nuscenes_infos_10sweeps_*.pkl stores the
# metadata for up to 9 sweeps per keyframe, and MAX_SWEEPS decides how many of them are actually
# loaded. The infos are shared with configs that do use sweeps; nothing is baked into them.
MAX_SWEEPS: 1
PRED_VELOCITY: False
SET_NAN_VELOCITY_TO_ZEROS: True
FILTER_MIN_POINTS_IN_GT: 1
BALANCED_RESAMPLING: False

# Unchanged. Derived 1.72 against a configured 1.75, inside the 0.04 m agreement band, and the
# two capture vehicles give the SAME value (n008 Boston 1.72, n015 Singapore 1.72), so the
# platform split does not affect this constant.
SHIFT_COOR: [0.0, 0.0, 1.75]

# VEHICLE / LOCATION are deliberately ABSENT, which means all frames. nuScenes is two capture
# platforms - n008 is every boston-seaport frame, n015 every Singapore frame - and they differ
# substantially in content (16.30 vs 6.77 Car/frame; Boston cars 22 cm longer). Splitting them
# was considered and declined to keep this family at one config per dataset. Any per-platform
# claim needs VEHICLE/LOCATION set; see experiments_md/20260922_02.

DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [nuscenes_infos_10sweeps_train.pkl],
    'test': [nuscenes_infos_10sweeps_val.pkl],
}

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z'],
    src_feature_list: ['x', 'y', 'z', 'intensity', 'timestamp'],
}
