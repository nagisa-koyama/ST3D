# nuScenes as an ACCUMULATING source, for the nuScenes -> KITTI density-correction ablation.
#
# Identical to da_nuscenes_dataset.yaml except for MAX_SWEEPS. It exists as its own layer-2 file
# rather than as an override inside each experiment so that the three ablation configs differ only
# in the correction, which is the variable under test.
#
# This DOES collide with the base's MAX_SWEEPS: 1 - one key, deliberately, documented here. The
# family's usual no-collision discipline exists to be immune to the 2025-02..2026-08 _BASE_CONFIG_
# precedence bug; that bug was fixed 2026-09-21 and the merge is now recursive with
# nearest-definition-wins, pinned by tests/test_config_merge.py and asserted over the repo's real
# configs by tests/test_config_real_configs.py.
_BASE_CONFIG_: cfgs/da-ieee-access/da_nuscenes_dataset.yaml

# 10 = 1 keyframe + 9 stored sweeps, which is the deepest MAX_SWEEPS can reach against the existing
# nuscenes_infos_10sweeps_*.pkl. get_lidar_with_sweeps() indexes info['sweeps'][k] with no clamp,
# so a larger value raises IndexError rather than silently truncating.
#
# Why 10 and what it buys, from experiments_md/20260922_07 and _08:
#   global radial parity with KITTI arrives at N=9, so 10 clears that bar;
#   pooled object parity needs N=15, which this cannot reach;
#   per 10 m ring the requirement runs 5 (0-10 m) to 150 (60-70 m), so no single depth is
#   right everywhere - 10 over-accumulates the near field and leaves past ~30 m short.
#
# For N=15: regenerate the infos with create_nuscenes_info(max_sweeps=15) to get
# nuscenes_infos_15sweeps_*.pkl, point INFO_PATH at them, and set MAX_SWEEPS: 15. It is a
# metadata-only pass over the nuScenes DB. Submit it with sbatch - it must outlive the ssh session.
MAX_SWEEPS: 10
