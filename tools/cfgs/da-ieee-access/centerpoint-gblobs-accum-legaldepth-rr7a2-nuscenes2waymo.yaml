# RELOCATE-AND-RENDER v7, arm (a) physics, refitted on v7 copies: the METHOD row for nuScenes -> Waymo (experiments_md 20261018_02 §12;
# design fixed in T05 §5, experiments_md c4a11d5; user ~12:56 10-19 「全て承認」). v7 = v6
# (centerpoint-gblobs-accum-legaldepth-rr6a-nuscenes2waymo) with the copy's bottom from E5a: the 4-40 m RANSAC plane shifted
# by the median residual of the frame's source GT car bottoms within 30 m (E5A_*); fallback E2-cell-p5 (10 m radius, the
# footprint grown by NEAR_D_LO excluded, 1 m cells' second-lowest z, 5th percentile, >= 3 cells), then the plane. v6's
# 4-75.2 m plane (PLANE_RMAX) stays for the occluders and the visibility rule. Arm (a), refitted once (§12.2): the
# physics model refitted to convergence on the v7 fitting copies (v7/fit_a.npz), after v6's frozen fit failed gate v7's
# held-out fit check (§12.6); this config is gated once.
#
# Base: teacher 27471's source recipe unchanged (ST3D df345c0, W&B jguwly5u) + the FULL Waymo target block 27596 scored
# 27471 with; read against 27596 = 51.58 Car BEV AP_R40 at IoU 0.7 on Waymo val, epoch 20. Legality: E5a reads SOURCE GT
# boxes only; the return model as v6.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-accum-legaldepth-nuscenes2waymo.yaml

