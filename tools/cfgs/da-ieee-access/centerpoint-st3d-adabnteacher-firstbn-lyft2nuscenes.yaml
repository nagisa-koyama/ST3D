# ANALYSIS ROW (first-BN-only teacher, chosen after inspecting target val - not a method row; the
# method rows use full AdaBN, user 2026-10-05). Job 27445 ran this exact config as
# centerpoint-st3d-dsbn-adabnteacher-lyft2nuscenes at ST3D a6f34de.
#
# Pseudo-labelling with a BN-ADAPTED TEACHER only (student keeps one shared BatchNorm), Lyft -> nuScenes
# (experiments_md/20261004_01). centerpoint-st3d-lyft2nuscenes + SELF_TRAIN.TEACHER_ADABN: the frozen
# teacher's BatchNorm statistics are re-estimated on 1,000 strided nuScenes TRAIN frames (no labels,
# weights untouched) before it generates, cut at its own count balance. Read against
# centerpoint-st3d-cb (plain teacher, its own count balance); with the DSNORM rows it separates the
# teacher's share of a per-domain-BN gain from the student's.
# Launch as 26698: 2 GPUs, --pretrained_model and --pretrained_model_teacher = ldb35c2o ep30.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-st3d-lyft2nuscenes.yaml

SELF_TRAIN:
    TEACHER_ADABN:
        FRAMES: 1000
        MIX: 1.0
        BATCH_SIZE: 4
        # First BN only (2026-10-05, experiments_md/20261004_01 §2.7): re-estimating backbone_3d.conv_input.1
        # alone recovers the gain without full AdaBN's deep-layer box inflation (S1 30.9 vs 28.6; S2 69.74 / 46.78
        # vs 65.26 / 26.22). Every other layer keeps the teacher's source statistics.
        LAYERS: '^backbone_3d\.conv_input\.1$'
    # Count-balance cuts of the FIRST-BN-adapted teacher (temporal persistence on nuScenes train, label-free,
    # pseudo-labels from job 27443): [0.229, 0.205, 0.277]. At these cuts: 7.7 Car / frame at precision 0.66,
    # 5.02 true / frame; pedestrians 2.2 / frame at 0.57. For comparison, the plain teacher at its own cuts
    # gives 14.5 / 0.36 / 5.30, and the fully adapted teacher 12.1 / 0.49 / 5.88 with 8.9 pedestrians / frame
    # at 0.26 (GT read for this diagnosis only).
    SCORE_THRESH: [0.229, 0.205, 0.277]
    NEG_THRESH: [0.1, 0.1, 0.1]
