# nuScenes in-domain ORACLE WITH INTENSITY - a diagonal cell of the cross-dataset intensity matrix
# (experiments_md/20261003_03). ONE VARIABLE from centerpoint-sourceonly-nuscenes (job 25743, 44.98 / 26.63
# on nuScenes val, x,y,z): intensity is added to the point features on both the train and the eval side,
# and INTENSITY_SCALE 255 puts nuScenes' raw 0-255 returns on the [0, 1] scale that KITTI, Waymo (tanh) and
# PandaSet (/255) already deliver - without it every cross-dataset cell would measure a 255x input-scale
# mismatch rather than intensity. Same schedule (20 epochs, global batch 6).
#
# Also the EVAL-ONLY scoring config for any x,y,z,intensity checkpoint on nuScenes val (e.g. the KITTI
# oracle with intensity, job 27184): at evaluation only DATA_CONFIG_TAR and MODEL are read.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-sourceonly-nuscenes.yaml

DATA_CONFIG:
    INTENSITY_SCALE: 255.0
    POINT_FEATURE_ENCODING: {
        encoding_type: absolute_coordinates_encoding,
        used_feature_list: ['x', 'y', 'z', 'intensity'],
        src_feature_list: ['x', 'y', 'z', 'intensity', 'timestamp'],
    }

DATA_CONFIG_TAR:
    INTENSITY_SCALE: 255.0
    POINT_FEATURE_ENCODING: {
        encoding_type: absolute_coordinates_encoding,
        used_feature_list: ['x', 'y', 'z', 'intensity'],
        src_feature_list: ['x', 'y', 'z', 'intensity', 'timestamp'],
    }
