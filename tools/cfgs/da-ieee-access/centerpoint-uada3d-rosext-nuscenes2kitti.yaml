# Three-level DA grid on S2 (experiments_md/20261004_01), cell F+O: UADA3D (feature level) with the
# target-free Car ROS interval [0.81, 1.06] (output level). One variable from
# centerpoint-uada3d-nuscenes2kitti (27174: 66.62 / 31.22). The conditional discriminator also sees
# box_preds_spatial, so it can pull target box SIZES toward the source's - the opposite of what the
# shrinking interval asks for. This row measures whether the two levels compose or fight.
# Departure from released UADA3D as in the parent (conditional GRL fix, ST3D 1247338).
# ENTRY adaptive_train.py, 2 GPUs, total batch 12 (3+3 per rank), 150G:
#   ENTRY=adaptive_train.py BATCH=12 EST_H=46 ... scripts/run_sourceonly_2gpu.sh <this cfg> <tag> <run>
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-uada3d-nuscenes2kitti.yaml

DATA_CONFIG:
    DATA_AUGMENTOR:
        DISABLE_AUG_LIST: ['normalize_object_size', 'random_object_rotation']
        AUG_CONFIG_LIST:
            - NAME: normalize_object_size  # DISABLED - not UDA-legal
              SIZE_RES: [-0.91, -0.49, -0.26]
            - NAME: random_object_rotation  # DISABLED
              ROT_PROB: 1.0
              ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
            - NAME: random_object_scaling
              SCALE_UNIFORM_NOISE: {
                  'Car': [0.81, 1.06],
                  'Pedestrian': [0.80, 1.25]
              }
            - NAME: random_world_flip
              ALONG_AXIS_LIST: ['x', 'y']
            - NAME: random_world_rotation
              WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
            - NAME: random_world_scaling
              WORLD_SCALE_RANGE: [0.95, 1.05]
