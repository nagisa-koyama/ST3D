# RELOCATE-AND-RENDER (RR), the METHOD row for nuScenes -> Waymo (experiments_md 20261018_02; design fixed in T05 §5,
# experiments_md 1963034; user's go 2026-10-18 ~03:55 「試しましょう。…UDA-legalな形で、距離全域に試しましょう」).
#
# Base: teacher 27471's source recipe unchanged (centerpoint-gblobs-accum-legaldepth-nuscenes2kitti: GBlobs, Boston 15 /
# Singapore 10 sweeps, per-object motion compensation, default augmentation; ST3D df345c0, W&B jguwly5u). Built as 27704's
# config was: the Waymo-target copy of 27468's recipe (centerpoint-accum-legaldepth-nuscenes2waymo, FULL da_waymo_dataset
# target block, the one 27596 scored 27471 with) + 27471's GBlobs VFE. The ONLY other change: `relocate_render` FIRST in
# both platforms' AUG_CONFIG_LIST (the rest of the list is 27471's resolved list, copied). Read against 27596 = 27471
# epoch 20 on Waymo val, 51.58 Car BEV AP_R40 at IoU 0.7. The resolved config is diffed against 27471's and 27596's logs
# before launch (20261018_02 §2).
#
# RR (pcdet/datasets/augmentor/relocate_render.py), training only, never on the target: each frame's source `Car`
# boxes (nuScenes `car` only under the KITTI ontology) with >= 200 points in the accumulated, compensated cloud are
# copied (at most 8 per frame, originals kept), rotated about the sensor's vertical axis to azimuth ~ U[0, 2 pi) and
# slid along the new ray to r' ~ U[r_donor, 75.2 m] (visible face and bottom height kept), checked for free space
# (0.5 m BEV margin: no GT box of any class or earlier copy, inside the range, <= 5 scene points above 0.3 m; 20 tries),
# re-rendered through a virtual Waymo TOP at 2.184 m (64 inclinations = median over the 798 TRAIN segments' published
# calibration, 2,650 columns; nearest point per pixel snapped onto its ray; no ray-drop), with occlusion against the
# scene (in-box points removed, shadow removed, copy points behind a scene point by > 0.5 m dropped). Rendered points
# carry the source point's intensity and time lag 0 (column 4 of src_feature_list); the network sees x, y, z only.
#
# Legality (memory/repo/uda_legality_rule.md): donors from SOURCE labels; lattice and mount height from the target's
# published sensor spec, TRAIN segments only; 75.2 m from the detector grid and the sensor range; every count fixed a
# priori (T05 §5) and never tuned on target results. Disclosure: the direction was motivated by a labelled diagnosis
# (20261017_13, analysis only). GBlobs as published (decision F); default size augmentation (ruled legal).
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-accum-legaldepth-nuscenes2waymo.yaml

MODEL:
    VFE:
        NAME: GBlobsVFE
        RELATIVE_DISTANCE: True
        COVARIANCE_ONLY: False
        COVARIANCE_SCALE: 1.0

DATA_CONFIGS:
    NUSCENES_N008:
        DATA_AUGMENTOR:
            AUG_CONFIG_LIST:
                - NAME: relocate_render
                  DONOR_CLASS: Car
                  MIN_DONOR_POINTS: 200
                  MAX_COPIES: 8
                  MAX_TRIES: 20
                  R_MAX: 75.2
                  BEV_MARGIN: 0.5
                  MAX_SCENE_POINTS: 5
                  CLEARANCE: 0.3
                  OCCLUSION_M: 0.5
                  POINT_CLOUD_RANGE: [-75.2, -75.2, -2, 75.2, 75.2, 4]
                  TIME_COLUMN: 4
                  LATTICE: waymo_top_train
                  N_COLS: 2650
                  MOUNT_HEIGHT: 2.184
                  CALIB: /home/koyama/data/waymo_top_calib/top_calib.pkl
                  TRAIN_SEGMENTS: /home/koyama/data/waymo_open_dataset_v_1_4_0/pcdet_structure/ImageSets/train.txt
                - NAME: normalize_object_size
                  SIZE_RES: [-0.91, -0.49, -0.26]
                - NAME: random_object_rotation
                  ROT_PROB: 1.0
                  ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
                - NAME: random_object_scaling
                  SCALE_UNIFORM_NOISE: {'Car': [0.85, 1.2], 'Pedestrian': [0.8, 1.25]}
                - NAME: random_world_flip
                  ALONG_AXIS_LIST: ['x', 'y']
                - NAME: random_world_rotation
                  WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
                - NAME: random_world_scaling
                  WORLD_SCALE_RANGE: [0.95, 1.05]
    NUSCENES_N015:
