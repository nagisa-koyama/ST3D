# S2 headline recipe with PER-DOMAIN BatchNorm on both sides, nuScenes -> KITTI (experiments_md/20261004_01).
#
# centerpoint-accum-st3d-nuscenes2kitti (27171: 80.69 / 48.29; seed 2 27248: 81.47 / 49.75) plus
# SELF_TRAIN.DSNORM (student keeps source and target BN statistics apart; evaluation uses the target
# set) and SELF_TRAIN.TEACHER_ADABN (the frozen teacher 26814's TARGET statistics re-estimated on 1,000
# strided KITTI train frames, eval-mode view, no labels, before it labels). Test time, the adapted
# teacher scores 76.54 / 53.77 against 78.20 / 46.67 as trained (AdaBN job 27287): BEV -1.7, 3D +7.1.
# Cuts: see SELF_TRAIN below (Car 0.30 count balance; Pedestrian / Cyclist 0.33 / 0.33 by the pre-declared
# source-val precision rule, replacing the headline's 0.6).
# Launch as 27171 (2 GPUs, 150G, ~13 h on 2 GPUs), --pretrained_model and --pretrained_model_teacher =
# 26814 ep20 (/storage/wandb/run-20261001_022243-2da6oz6e/files/ckpt/checkpoint_epoch_20.pth).
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-accum-st3d-nuscenes2kitti.yaml

SELF_TRAIN:
    # Cuts. Car: the full-AdaBN 26814 teacher's label-free count balance on KITTI train (per-ring joint
    # mixture inside 30 m) = 0.301, the same as the unadapted teacher's. Pedestrian / Cyclist: the
    # PRE-DECLARED source-val precision rule (experiments_md/20261004_01 §5c, source_precision_cut.py),
    # 26814 as trained on nuScenes val at 15 sweeps (job 27458) -> 0.33 / 0.33. This replaces the
    # headline recipe's 0.6, which had been chosen against target labels (user 2026-10-05).
    SCORE_THRESH: [0.30, 0.33, 0.33]
    NEG_THRESH: [0.1, 0.1, 0.1]
    DSNORM: True
    TEACHER_ADABN:
        FRAMES: 1000
        MIX: 1.0
        BATCH_SIZE: 4
        # FULL AdaBN, the pre-declared textbook variant (user's decision 2026-10-05: the first-BN-only choice
        # was made after inspecting target val, so it is an analysis row only - see the -firstbn twin).
