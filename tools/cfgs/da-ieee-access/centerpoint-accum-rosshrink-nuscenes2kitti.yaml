# nuScenes -> KITTI, accumulation only, with a SHRINKING Car ROS interval [0.75, 1.00].
#
# Differs from centerpoint-accum-nuscenes2kitti (job 26388: 71.93 BEV / 39.95 3D moderate) only in
# random_object_scaling's Car interval. Everything else, including MAX_SWEEPS 15 and motion
# compensation, is inherited.
#
# WHY. On this pair BEV is at 96% of the KITTI oracle while 3D moderate is at 62% (39.95 vs 64.23),
# and experiments_md/20260926_03 traced the 3D gap to box SIZE, not SHIFT_COOR: predicted KITTI cars
# are +0.31 / +0.16 / +0.07 m too long / wide / tall, and accumulation made it worse. The family's
# Car interval [0.85, 1.20] has mean 1.025, so it ENLARGES source cars on average, while every source
# here is a larger-vehicle domain than KITTI. [0.75, 1.00] (mean 0.875) is the interval the
# da-MIRU2025 family already used for KITTI targets - a prior, not a value tuned on KITTI labels.
# Pedestrian is left at [0.80, 1.25]; the size analysis covered Car only.
#
# YAML lists replace rather than merge, so the whole AUG_CONFIG_LIST is restated in both platform
# blocks, copied from preprocess_sourceonly.yaml with only the Car interval changed.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-accum-nuscenes2kitti.yaml

DATA_CONFIGS:
    NUSCENES_N008:
        DATA_AUGMENTOR:
            DISABLE_AUG_LIST: ['normalize_object_size', 'random_object_rotation']
            AUG_CONFIG_LIST:
                - NAME: normalize_object_size  # DISABLED - not UDA-legal
                  SIZE_RES: [-0.91, -0.49, -0.26]
                - NAME: random_object_rotation  # DISABLED
                  ROT_PROB: 1.0
                  ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
                - NAME: random_object_scaling
                  SCALE_UNIFORM_NOISE: {
                      'Car': [0.75, 1.00],
                      'Pedestrian': [0.80, 1.25]
                  }
                - NAME: random_world_flip
                  ALONG_AXIS_LIST: ['x', 'y']
                - NAME: random_world_rotation
                  WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
                - NAME: random_world_scaling
                  WORLD_SCALE_RANGE: [0.95, 1.05]
    NUSCENES_N015:
        DATA_AUGMENTOR:
            DISABLE_AUG_LIST: ['normalize_object_size', 'random_object_rotation']
            AUG_CONFIG_LIST:
                - NAME: normalize_object_size  # DISABLED - not UDA-legal
                  SIZE_RES: [-0.91, -0.49, -0.26]
                - NAME: random_object_rotation  # DISABLED
                  ROT_PROB: 1.0
                  ROT_UNIFORM_NOISE: [-0.78539816, 0.78539816]
                - NAME: random_object_scaling
                  SCALE_UNIFORM_NOISE: {
                      'Car': [0.75, 1.00],
                      'Pedestrian': [0.80, 1.25]
                  }
                - NAME: random_world_flip
                  ALONG_AXIS_LIST: ['x', 'y']
                - NAME: random_world_rotation
                  WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
                - NAME: random_world_scaling
                  WORLD_SCALE_RANGE: [0.95, 1.05]
