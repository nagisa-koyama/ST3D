# EVAL-ONLY Waymo twin of centerpoint-accum-legaldepth-zbuffer-nuscenes2kitti (H1, anchor-viewpoint z-buffer after
# accumulation). Source blocks identical to the training config (sample_points_learned is a no-op at eval); target
# block = 27590's. Reading in the training config.
_BASE_CONFIG_: cfgs/da-ieee-access/centerpoint-accum-legaldepth-nuscenes2waymo.yaml

DATA_CONFIGS:
    NUSCENES_N008:
        DATA_PROCESSOR:
            - NAME: mask_points_and_boxes_outside_range
              REMOVE_OUTSIDE_BOXES: True
            - NAME: shuffle_points
              SHUFFLE_ENABLED: {'train': True, 'test': False}
            - NAME: sample_points_learned
              WEIGHTS: /home/koyama/data/samplers/lattice_n008_waymo_init.npz
            - NAME: transform_points_to_voxels
              VOXEL_SIZE: [0.1, 0.1, 0.15]
              MAX_POINTS_PER_VOXEL: 10
              MAX_NUMBER_OF_VOXELS: {'train': 150000, 'test': 150000}
    NUSCENES_N015:
        DATA_PROCESSOR:
            - NAME: mask_points_and_boxes_outside_range
              REMOVE_OUTSIDE_BOXES: True
            - NAME: shuffle_points
              SHUFFLE_ENABLED: {'train': True, 'test': False}
            - NAME: sample_points_learned
              WEIGHTS: /home/koyama/data/samplers/lattice_n015_waymo_init.npz
            - NAME: transform_points_to_voxels
              VOXEL_SIZE: [0.1, 0.1, 0.15]
              MAX_POINTS_PER_VOXEL: 10
              MAX_NUMBER_OF_VOXELS: {'train': 150000, 'test': 150000}
