# G0 smoke (experiments_md episodes/20261116_01 §5, §8): the nuScenes recipe on 2 train and 1 val scenes for 2 epochs at
# the real batch 12, to check the nuScenes reader in the loop, the target dump, the eval matrices and the peak GPU
# memory. Its numbers mean nothing.
#   ENTRY=train_seg.py BATCH=12 WANDB_NOTES="..." scripts/submit.sh --nice=100 --gres=gpu:1 --cpus-per-task=8 \
#     --mem=64G --time=01:00:00 --job-name=pcseg_nus_smoke scripts/run_seg.sh cfgs/pcseg/spunet-nuscenes-smoke.yaml
_BASE_CONFIG_: cfgs/pcseg/spunet-nuscenes.yaml

DATA:
  SCENES:
    train: ['scene-0001', 'scene-0002']     # the first two train scenes of the index
    val: ['scene-0003']                     # the first val scene
  EXPECT_SEQUENCES: {train: 2, val: 1}

OPTIMIZATION:
  NUM_EPOCHS: 2
  SAVE_EVERY: 1
  MAX_CKPT: 2
  LOG_EVERY: 2

EVAL:
  EVERY: 1
