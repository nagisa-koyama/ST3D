# S1 smoke (experiments_md episodes/20261116_01 §8): the oracle recipe on 2 train and 1 val sequences for 2 epochs, to
# check the loop, DDP, W&B, checkpoints, the eval matrices and the target dump. Its numbers mean nothing.
#   ENTRY=train_seg.py BATCH=4 WANDB_NOTES="..." scripts/submit.sh --gres=gpu:1 --cpus-per-task=8 --mem=64G \
#     --time=01:00:00 --job-name=pcseg_smoke scripts/run_seg.sh cfgs/pcseg/spunet-pandaset64-smoke.yaml
_BASE_CONFIG_: cfgs/pcseg/spunet-pandaset64.yaml

DATA:
  SPLITS:
    train: ['035', '041']
    val: ['097']
  EXPECT_SEQUENCES: {train: 2, val: 1}

OPTIMIZATION:
  BATCH_SIZE: 4
  NUM_EPOCHS: 2
  SAVE_EVERY: 1
  MAX_CKPT: 2
  LOG_EVERY: 5

EVAL:
  EVERY: 1
