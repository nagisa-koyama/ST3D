# One-GPU smoke of P2 row spunet-p2-m-ns2sk (experiments_md episodes/20261128_01 §8): the row's config on 2 train and 1 val
# scenes for 2 epochs at the real batch 12, as spunet-nuscenes-smoke.yaml. It checks the loop and the TARGET DUMP
# (tools/analysis/pcseg_arm_smoke_check.py for a method row) and measures the step time. Its numbers mean nothing.
#   ENTRY=train_seg.py BATCH=12 WANDB_NOTES="..." scripts/submit.sh --nice=100 --gres=gpu:1 --cpus-per-task=8 \
#     --mem=64G --time=01:00:00 --job-name=pcseg_p2_smoke_m-ns2sk scripts/run_seg.sh cfgs/pcseg/spunet-p2-m-ns2sk-smoke.yaml
_BASE_CONFIG_: cfgs/pcseg/spunet-p2-m-ns2sk.yaml

DATA:
  SCENES:
    train: ['scene-0001', 'scene-0002']     # the first two train scenes of the index
    val: ['scene-0003']                     # the first val scene
  EXPECT_SEQUENCES: {train: 2, val: 1}

OPTIMIZATION:
  NUM_EPOCHS: 2
  SAVE_EVERY: 1
  MAX_CKPT: 2
  LOG_EVERY: 2

EVAL:
  EVERY: 1
