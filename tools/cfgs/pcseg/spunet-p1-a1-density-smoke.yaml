# One-GPU smoke of S3 arm a1-density (experiments_md episodes/20261116_01 §8.10; bug_prevention_checklist rule 4): the arm's
# config on 2 train and 1 val sequences for 2 epochs, as spunet-pandaset64-smoke.yaml does for the oracle. It checks the
# loop and the arm's TARGET DUMP (tools/analysis/pcseg_arm_smoke_check.py). Its numbers mean nothing.
#   ENTRY=train_seg.py BATCH=4 WANDB_NOTES="..." scripts/submit.sh --nice=100 --gres=gpu:1 --cpus-per-task=8 \
#     --mem=64G --time=01:00:00 --job-name=pcseg_smoke_a1-density scripts/run_seg.sh cfgs/pcseg/spunet-p1-a1-density-smoke.yaml
_BASE_CONFIG_: cfgs/pcseg/spunet-p1-a1-density.yaml

DATA:
  SPLITS:
    train: ['035', '041']
    val: ['097']
  EXPECT_SEQUENCES: {train: 2, val: 1}

OPTIMIZATION:
  BATCH_SIZE: 4
  NUM_EPOCHS: 2
  SAVE_EVERY: 1
  MAX_CKPT: 2
  LOG_EVERY: 5

EVAL:
  EVERY: 1
