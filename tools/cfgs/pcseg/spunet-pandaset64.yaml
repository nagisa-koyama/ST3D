# pcseg M1 on PandaSet Pandar64: the P1 oracle recipe (experiments_md episodes/20261116_01 §5, §6).
# ANALYSIS row: trained on target labels (uda_legality_rule.md, analysis exception).
#
# Model and optimisation are Pointcept's SpUNet-v1m1 nuScenes recipe AS PUBLISHED
# (configs/nuscenes/semseg-spunet-v1m1-0-base.py at 77f87ab): never tuned on PandaSet results.
# Launch (total batch 12, as Pointcept):
#   ENTRY=train_seg.py BATCH=12 EST_H=<h> WANDB_NOTES="..." \
#     scripts/submit.sh --nice=100 --job-name=<x> scripts/run_seg.sh cfgs/pcseg/spunet-pandaset64.yaml [tag] [run_name]
# (from the seg worktree's tools/; run_seg.sh defaults ENTRY to train_seg.py)
PCSEG: True

DATA:
  NAME: PandasetSeg
  ROOT: /home/koyama/data/pandaset/dataset
  LIDAR_DEVICE: 0                   # 0 Pandar64, 1 PandarGT
  SHIFT_COOR: [0.0, 0.0, 0.30]      # the detection family's PandaSet value (da_pandaset_dataset.yaml)
  CLASS_MAP: pandaset_scalr17       # ScaLR's published 17-class map (pcseg/class_map.py; O2, 20261116_01 §6)
  GRID_SIZE: 0.05
  # The detection split (dataset_configs/pandaset_dataset.yaml SEQUENCES), verbatim; sequences without semseg are
  # skipped and listed in the log. tests/test_pcseg_engine.py checks both lists against the detection config.
  SPLITS:
    train: ['014', '050', '079', '048', '093', '091', '063', '104', '100', '092', '012', '047', '018', '006', '099',
            '085', '035', '041', '052', '105', '030', '113', '002', '084', '028', '119', '044', '005', '102', '034',
            '077', '064', '067', '058', '019', '015', '037', '095', '120', '066', '023', '071', '117', '098', '139',
            '038', '116', '046', '088', '089', '040', '033', '016', '024', '122', '039', '158', '069', '124', '123',
            '106']
    val: ['045', '059', '055', '051', '020', '097', '073', '043', '003', '101', '027', '056', '011', '078', '080',
          '109', '042', '021', '094', '057']
  EXPECT_SEQUENCES: {train: 45, val: 15}
  # Pointcept's transform list, in order: RandomRotate z [-1, 1] pi p 0.5, RandomScale [0.9, 1.1], RandomFlip p 0.5,
  # RandomJitter sigma 0.005 clip 0.02; then GridSample 0.05 (fnv hash, train mode); feat = coord + strength.
  AUG: {ROTATE_Z_PROB: 0.5, SCALE: [0.9, 1.1], FLIP_PROB: 0.5, JITTER: [0.005, 0.02]}

MODEL:
  NAME: SpUNet
  IN_CHANNELS: 4                    # x, y, z, intensity / 255
  CHANNELS: [32, 64, 128, 256, 256, 128, 96, 96]
  LAYERS: [2, 3, 4, 6, 2, 2, 2, 2]

OPTIMIZATION:
  BATCH_SIZE: 12                    # TOTAL across ranks; --batch_size overrides
  NUM_EPOCHS: 391                   # STEP BUDGET, not epochs, is the constant (the detection paper's rule; experiments_md
                                    # 20261116_01 §8.6): the nuScenes recipe's 50 x 2,344 = 117,200 steps / 300 iterations
                                    # per epoch (3,600 frames at batch 12) = 390.7 -> 391 (117,300 steps)
  LR: 0.002
  WEIGHT_DECAY: 0.005
  PCT_START: 0.04
  DIV_FACTOR: 10.0
  FINAL_DIV_FACTOR: 100.0
  AMP: True
  SYNC_BN: True                     # world > 1: BN statistics over the GLOBAL batch, as on one GPU; inert at one rank
  GLOBAL_LOSS_MEAN: True            # world > 1: CE sum / GLOBAL point count, not the per-rank mean; inert at one rank
  NUM_WORKERS: 8                    # per rank
  EVAL_BATCH_PER_GPU: 4
  SAVE_EVERY: 13                    # 470 MB per checkpoint: 31 saves over 391 epochs, not 78; the last is always saved
  MAX_CKPT: 3
  LOG_EVERY: 50

EVAL:
  EVERY: 39                         # 11,700 steps, as the nuScenes recipe's every 5 epochs (11,720); the LAST epoch is
                                    # always scored, and it is the number reported (pre-declared)
  CONE: {FOV_DEG: 60.0, HEADING_DEG: 0.0}   # PandarGT's cone, as EVAL_FOV_FILTER in detection; an extra matrix

TARGET_DUMP_FRAMES: 4
