# Reliance form of arm a3 (experiments_md episodes/20261116_01 §8.7 item 2): the Pandar64 oracle's config with its VAL
# clouds cut to the 60 deg cone BEFORE the model sees them (the model gets no context outside the cone). No training:
# score the UNPERTURBED Pandar64 oracle's checkpoint with tools/test_seg.py on this config. Unlike the oracle's own cone
# matrix, which scores in-cone points of a full-frame prediction.
_BASE_CONFIG_: cfgs/pcseg/spunet-pandaset64.yaml

DATA:
  EVAL_PERTURB:
    CONE: {FOV_DEG: 60.0, HEADING_DEG: 0.0}
